name: Build and test

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
          - name: macos-clang
            os: macos-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev tzdata

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Error summary
        if: failure()
        shell: bash
        run: python3 .github/scripts/error_summary.py build.log 4 || python .github/scripts/error_summary.py build.log 4
