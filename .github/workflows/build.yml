name: Build and test

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
            # The memory manager without the debugging heap (the other jobs
            # build the default: the debugging heap).
          - name: linux-gcc-memory-manager
            os: ubuntu-latest
            cxx: g++
            flags: -DUSE_MEMORY_MANAGER=ON -DUSE_MEMORY_DEBUGGING=OFF
          - name: macos-clang
            os: macos-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev tzdata liblz4-dev libzstd-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows lz4:x64-windows zstd:x64-windows

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 zstd

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --timeout 240

      - name: Time zone sources (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: build/test/Release/TestDate.exe | grep -E "zones|ICU|skipped|not installed|checks" || true

      - name: Error summary
        if: failure()
        shell: bash
        run: python3 .github/scripts/error_summary.py build.log 4 || python .github/scripts/error_summary.py build.log 4

  packages:
    name: linux-packages (deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev rpm liblz4-dev libzstd-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIASLIB_BUILD_TESTS=OFF
          cmake --build build --parallel 4

      - name: Package
        run: |
          cd build
          cpack -G "DEB;RPM;TGZ"
          ls -l *.deb *.rpm *.tar.gz
          dpkg-deb -I *.deb
          rpm -qip *.rpm

      - name: Check that the installed package works with find_package
        run: |
          sudo dpkg -i build/*.deb
          mkdir -p /tmp/consumer && cd /tmp/consumer
          printf 'cmake_minimum_required(VERSION 3.14)\nproject(C CXX)\nfind_package(IASLib 3.0 REQUIRED)\nadd_executable(c main.cpp)\ntarget_link_libraries(c PRIVATE IASLib::IASLib)\n' > CMakeLists.txt
          printf '#include "IASLib.h"\n#include <cstdio>\nint main(){ IASLib::CString s("ok "); s += IASLib_VERSION_STRING; printf("%%s\\n",(const char*)s); return 0; }\n' > main.cpp
          cmake -S . -B build && cmake --build build && ./build/c

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: IASLib-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error
